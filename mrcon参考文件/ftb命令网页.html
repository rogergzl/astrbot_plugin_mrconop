<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FTB我的世界指令一键生成器【中文下拉优化版】</title>
    <style>
        *{box-sizing: border-box;margin:0;padding:0;font-family:Microsoft Yahei}
        body{display:flex;flex-direction:column;padding:12px;gap:12px;background:#f5f5f5;min-height:100vh}
        .top-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:10px;border-radius:8px;box-shadow:0 1px 5px #ddd}
        .container-row{display:flex;gap:12px;flex:1}
        .left{width:320px;background:#fff;padding:16px;border-radius:8px;box-shadow:0 1px 6px #ddd;overflow-y:auto}
        .mid{flex:1;background:#fff;padding:16px;border-radius:8px;box-shadow:0 1px 6px #ddd;overflow-y:auto}
        .right{width:360px;background:#fff;padding:16px;border-radius:8px;box-shadow:0 1px 6px #ddd;display:flex;flex-direction:column}
        h3{margin-bottom:12px;color:#222;border-bottom:1px solid #eee;padding-bottom:6px;font-size:16px}
        select,input{padding:8px;margin:6px 0;border:1px solid #ccc;border-radius:4px}
        input{width:100%}
        .required{color:red;font-weight:bold}
        .cmd-preview{padding:12px;background:#222;color:#0f0;font-family:Consolas;min-height:120px;border-radius:6px;margin:10px 0;white-space:pre-wrap;flex:1}
        button{padding:8px 12px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;margin:4px}
        button:hover{background:#1d4ed8}
        .btn-red{background:#dc3545}
        .btn-green{background:#28a745}
        .remark-text{color:#555;margin:8px 0;padding:8px;background:#f8f8f8;border-radius:4px}
        .color-box-wrap{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
        .color-btn{width:26px;height:26px;border:1px solid #666;cursor:pointer;border-radius:3px}
        .top-input{flex:1;min-width:220px}
        .tab-btn-group{margin:8px 0}
        .collect-item{padding:4px 6px;background:#eef;border-radius:3px;margin:3px;cursor:pointer}
    </style>
</head>
<body>
<!--顶部工具栏：搜索+筛选+导出+颜色面板开关-->
<div class="top-bar">
    <input class="top-input" id="searchInput" placeholder="🔍搜索模组/中文名称/命令/注释内容...">
    <select id="authFilter">
        <option value="all">全部权限</option>
        <option value="Player">仅普通玩家</option>
        <option value="OP">仅管理员OP</option>
    </select>
    <button id="exportExcel">📥导出全部指令Excel</button>
    <button id="toggleColorPanel">🎨MC颜色代码面板</button>
    <button id="toggleCollect">⭐打开收藏夹</button>
</div>
<!--MC颜色面板（默认隐藏）-->
<div id="colorPanel" style="display:none;background:#fff;padding:10px;border-radius:8px">
    <div class="color-box-wrap" id="colorWrap"></div>
    <span>提示：点击颜色自动插入当前正在编辑的参数输入框（MC§彩色符号）</span>
</div>
<!--收藏面板（默认隐藏）-->
<div id="collectPanel" style="display:none;background:#fff;padding:10px;border-radius:8px;margin-bottom:8px">
    <h4>收藏指令列表 <button class="btn-red" id="clearAllCollect">清空全部收藏</button></h4>
    <div id="collectList"></div>
</div>

<div class="container-row">
    <div class="left">
        <h3>1.选择模组与指令</h3>
        <label>选择模组：</label>
        <select id="modSelect"></select>
        <label>选择命令：</label>
        <select id="cmdSelect"></select>
        <div style="margin-top:10px">
            <span>权限：<span id="authTip"></span></span>
            <div style="font-size:13px;color:#777;margin-top:4px">原始指令：<span id="originCmdText"></span></div>
        </div>
        <div class="tab-btn-group">
            <button id="addCollect" class="btn-green">⭐收藏当前指令</button>
        </div>
    </div>
    <div class="mid">
        <h3>2.填写参数（*为必填）</h3>
        <div id="paramBox"></div>
        <div class="remark-text"><b>指令注释：</b><span id="remarkBox"></span></div>
    </div>
    <div class="right">
        <h3>3.生成指令结果</h3>
        <div class="cmd-preview" id="resultCmd"></div>
        <button id="copyBtn">一键复制指令</button>
    </div>
</div>

]

const resBox = document.getElementById('resultCmd');

const originCmdText = document.getElementById('originCmdText'); //新增：展示原始指令
const remarkBox = document.getElementById('remarkBox');
const copyBtn = document.getElementById('copyBtn');
const searchInput = document.getElementById('searchInput');
const authFilter = document.getElementById('authFilter');
const exportExcel = document.getElementById('exportExcel');
const toggleColorPanel = document.getElementById('toggleColorPanel');
const colorPanel = document.getElementById('colorPanel');
const colorWrap = document.getElementById('colorWrap');
const toggleCollect = document.getElementById('toggleCollect');
const collectPanel = document.getElementById('collectPanel');
const collectList = document.getElementById('collectList');
const addCollect = document.getElementById('addCollect');

// 初始化MC颜色按钮
function initColorBtn(){
    colorWrap.innerHTML = '';
    mcColorList.forEach(item=>{
        let div = document.createElement('div');
        div.className = 'color-btn';
        div.style.background = item.bg;
        div.title = item.code + (item.text||'颜色');
        div.dataset.code = item.code;
        div.onclick = ()=>{
            if(nowFocusInput){
                let pos = nowFocusInput.selectionStart;
                let val = nowFocusInput.value;
                nowFocusInput.value = val.slice(0,pos)+item.code+val.slice(pos);
                buildCmd();
            }else{
                alert('请先点击一个参数输入框，再插入颜色码！')
            }
        }
        colorWrap.appendChild(div);
    })
}
initColorBtn();

// 刷新模组下拉+指令下拉【重点：option显示showName中文，value存json】
function refreshModAndCmd(){
    let modList = [...new Set(filterCmd.map(v=>v.modName))];
    modSel.innerHTML = '';
    modList.forEach(m=>{
        let op = document.createElement('option');
        op.innerText = m;op.value=m;
        modSel.appendChild(op);
    })
    modSel.dispatchEvent(new Event('change'))
}

// 筛选指令（搜索支持搜中文showName、原cmd、模组、备注）
function filterCommand(){
    let key = searchInput.value.trim().toLowerCase();
    let authVal = authFilter.value;
    filterCmd = allCmd.filter(item=>{
        let matchSearch = item.cmd.toLowerCase().includes(key)
            ||item.modName.toLowerCase().includes(key)
            ||item.remark.toLowerCase().includes(key)
            ||item.showName.toLowerCase().includes(key); //支持中文搜索
        let matchAuth = authVal==='all'||item.auth===authVal;
        return matchSearch&&matchAuth;
    })
    refreshModAndCmd();
}

// 切换模组刷新命令
modSel.onchange = ()=>{
    let curMod = modSel.value;
    let filterModCmd = filterCmd.filter(v=>v.modName===curMod);
    cmdSel.innerHTML = '';
    filterModCmd.forEach(c=>{
        let op = document.createElement('option');
        op.innerText = c.showName; //下拉只展示中文注释名称
        op.value = JSON.stringify(c); //值内部完整保存原始数据
        cmdSel.appendChild(op);
    })
    cmdSel.dispatchEvent(new Event('change'))
}

// 切换指令生成参数框
cmdSel.onchange = ()=>{
    let data = JSON.parse(cmdSel.value);
    authTip.innerText = data.auth==='OP'?'管理员OP':'普通玩家可用';
    originCmdText.innerText = data.cmd; //左侧显示原始英文指令
    remarkBox.innerText = data.remark;
    paramBox.innerHTML = '';
    // 渲染参数
    data.params.forEach(p=>{
        let lab = document.createElement('label');
        lab.innerHTML = `${p.name} ${p.required?'<span class="required">*</span>':''}：${p.desc}`;
        let inp = document.createElement('input');
        inp.dataset.key = p.name;
        inp.placeholder = `输入${p.type}`;
        // 监听输入框聚焦，用于颜色插入
        inp.onfocus = ()=> nowFocusInput = inp;
        inp.oninput = buildCmd;
        paramBox.appendChild(lab);
        paramBox.appendChild(inp);
    })
    buildCmd();
}

// 拼接指令（仍然使用原始cmd生成，不受中文下拉影响）
function buildCmd(){
    let data = JSON.parse(cmdSel.value);
    let base = data.cmd;
    let inputs = paramBox.querySelectorAll('input');
    inputs.forEach(inp=>{
        let val = inp.value.trim();
        if(val) base += ' '+val;
    })
    resBox.innerText = base;
}

// 复制按钮
copyBtn.onclick = async ()=>{
    await navigator.clipboard.writeText(resBox.innerText);
    alert('指令已复制剪贴板！')
}

// 搜索&筛选绑定事件
searchInput.oninput = filterCommand;
authFilter.onchange = filterCommand;

// 颜色面板显示隐藏
toggleColorPanel.onclick = ()=>{
    colorPanel.style.display = colorPanel.style.display==='none'?'block':'none'
}

// =====收藏相关=====
// 刷新收藏列表
function renderCollect(){
    collectList.innerHTML = '';
    collectArr.forEach((item,idx)=>{
        let div = document.createElement('div');
        div.className = 'collect-item';
        div.innerText = `${item.showName}｜【${item.auth}】${item.cmd}`;
        //点击选中收藏指令
        div.onclick = ()=>{
            searchInput.value = item.showName;
            filterCommand();
            setTimeout(()=>{
                //自动选中这条指令
                for(let opt of cmdSel.options){
                    let optData = JSON.parse(opt.value);
                    if(optData.cmd===item.cmd){opt.selected=true;cmdSel.dispatchEvent(new Event('change'));break}
                }
            },100)
        }
        //右键删除单条收藏
        div.oncontextmenu=(e)=>{
            e.preventDefault();
            collectArr.splice(idx,1);
            localStorage.setItem('ftbCollect',JSON.stringify(collectArr));
            renderCollect();
        }
    })
}
renderCollect();

//打开关闭收藏面板
toggleCollect.onclick = ()=>{
    collectPanel.style.display = collectPanel.style.display==='none'?'block':'none'
}
//添加当前指令到收藏
addCollect.onclick = ()=>{
    let curCmdData = JSON.parse(cmdSel.value);
    let isExist = collectArr.find(i=>i.cmd===curCmdData.cmd);
    if(isExist){alert('该指令已经在收藏夹中！');return}
    collectArr.push(curCmdData);
    localStorage.setItem('ftbCollect',JSON.stringify(collectArr));
    renderCollect();
    alert('收藏成功！');
}
//清空全部收藏
clearAllCollect.onclick = ()=>{
    if(!confirm('确定清空所有收藏指令？'))return;
    collectArr=[];
    localStorage.setItem('ftbCollect','[]');
    renderCollect();
}

// =====导出Excel（CSV，Excel直接打开）=====
exportExcel.onclick = ()=>{
    //组装csv表头+数据
    let csv = '模组名称,中文别名,原始指令,权限,指令备注,参数信息\n';
    allCmd.forEach(item=>{
        let paramStr = item.params.map(p=>`${p.name}(${p.type},${p.required?'必填':'选填'}):${p.desc}`).join('|');
        csv += `"${item.modName}","${item.showName}","${item.cmd}","${item.auth}","${item.remark}","${paramStr}"\n`
    })
    //下载文件
    let blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'FTB全指令清单.csv';
    a.click();
}

// 初始化加载
filterCommand();
</script>
</body>
</html>
